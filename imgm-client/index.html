<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMGM · I Am Gaming: game reviews and what to play next</title>
    <!-- What search engines and link previews show. The name to find us by is IMGM. -->
    <meta name="description" content="IMGM (I Am Gaming) is a community game review site. Players rate the games they play, and every rating becomes a collectible card." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IMGM" />
    <meta property="og:title" content="IMGM · I Am Gaming" />
    <meta property="og:description" content="Players rate the games they play. Every rating becomes a collectible card." />
    <meta property="og:url" content="https://imgm.app/" />
    <!-- The picture a shared link shows (1200x630, the size Facebook, X, Discord and
         WhatsApp all crop well); the large card puts it full width on X -->
    <meta property="og:image" content="https://imgm.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="IMGM: players rate the games they play, and every rating becomes a collectible card" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://imgm.app/og-image.png" />
    <meta name="twitter:image:alt" content="IMGM: players rate the games they play, and every rating becomes a collectible card" />
    <!-- Tells Google the site's name, so searching "IMGM" or "I Am Gaming" finds it -->
    <script type="application/ld+json">
      { "@context": "https://schema.org", "@type": "WebSite", "name": "IMGM", "alternateName": ["I Am Gaming", "imgm.app"], "url": "https://imgm.app/" }
    </script>
    <!-- The brand behind the site, with its logo: helps Google treat "IMGM" as a name -->
    <script type="application/ld+json">
      { "@context": "https://schema.org", "@type": "Organization", "name": "IMGM", "alternateName": "I Am Gaming", "url": "https://imgm.app/", "logo": "https://imgm.app/icon-512.png" }
    </script>
    <!-- Icons: the SVG for browsers, PNG/ICO for Google's results (sizes in multiples of
         48px) and older browsers, the Apple one for home screens -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#100f0d" />
    <!-- The three Noir fonts, in one request: Big Shoulders (headlines, the IMGM wordmark,
         card titles and scores; weight 800 only, the one the site uses, but with its
         optical-size axis, so big headlines and small labels each get the right cut),
         Host Grotesk (all other text, 400/500/600 only: a font-bold asks for 700, which
         isn't loaded, so it shows at 600) and Noto Serif Display italic (review quotes
         only). Tokens for them live in src/index.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,800&family=Host+Grotesk:wght@400;500;600&family=Noto+Serif+Display:ital,wght@1,400&display=swap" />
    <!-- Game covers and art come from IGDB: open that connection early. No crossorigin:
         images load without CORS, so a CORS connection would go unused. -->
    <link rel="preconnect" href="https://images.igdb.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
