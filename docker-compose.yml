services:
  db:
    image: postgres:15-alpine
    container_name: imgm-postgres
    restart: always
    environment:
      POSTGRES_USER: imgm_user
      POSTGRES_PASSWORD: imgm_password
      POSTGRES_DB: imgm_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imgm_user -d imgm_db"]
      interval: 2s
      timeout: 5s
      retries: 15

  server:
    build:
      context: ./imgm-server
    container_name: imgm-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    # Apply any new migrations and regenerate the Prisma client on every start, so schema
    # changes apply without an image rebuild (the baked-in client goes stale otherwise)
    command: sh -c "npx prisma migrate deploy && npx prisma generate && npm run dev"
    env_file:
      - ./imgm-server/.env
    environment:
      # Override localhost with the internal docker service name ('db')
      - DATABASE_URL=postgresql://imgm_user:imgm_password@db:5432/imgm_db?schema=public
    volumes:
      # Mount the local folder to see changes instantly
      - ./imgm-server:/app
      # Prevent the host's local node_modules from overwriting the container's Alpine modules
      - /app/node_modules 

  client:
    build:
      context: ./imgm-client
    container_name: imgm-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./imgm-client:/app
      - /app/node_modules

volumes:
  pgdata:
