services:
  db:
    image: pgvector/pgvector:pg15
    container_name: imgm-postgres
    restart: always
    environment:
      POSTGRES_USER: imgm_user
      POSTGRES_PASSWORD: imgm_password
      POSTGRES_DB: imgm_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imgm_user -d imgm_db"]
      interval: 2s
      timeout: 5s
      retries: 15

  server:
    build:
      context: ./imgm-server
    container_name: imgm-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    # On every start, bring the container up to date with the code — no image rebuild needed:
    #   1. npm install: installs any package added to package.json since the image was built
    #      (--no-save: never rewrites package.json / package-lock.json in your folder)
    #   2. apply new database migrations   3. regenerate the Prisma client   4. start the server
    command: sh -c "npm install --no-save --no-audit --no-fund && npx prisma migrate deploy && npx prisma generate && npm run dev"
    env_file:
      - ./imgm-server/.env
    environment:
      # Override localhost with the internal docker service name ('db')
      - DATABASE_URL=postgresql://imgm_user:imgm_password@db:5432/imgm_db?schema=public
      # The AI service (imgm-ai) runs on the host during development: uv run uvicorn ...
      - AI_SERVICE_URL=http://host.docker.internal:8000
    volumes:
      # Mount the local folder to see changes instantly
      - ./imgm-server:/app
      # Prevent the host's local node_modules from overwriting the container's Alpine modules
      - /app/node_modules 

  client:
    build:
      context: ./imgm-client
    container_name: imgm-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - server
    # On every start, install any package added to package.json since the image was built
    # (--no-save: never rewrites package.json / package-lock.json), then start Vite
    command: sh -c "npm install --no-save --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./imgm-client:/app
      - /app/node_modules

volumes:
  pgdata:
